<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- A status board reading 3: dark panel, amber readout, the level
       ladder down the left, and the lamp on top that these things have. -->
  <rect x="2" y="6" width="28" height="22" fill="#c0c0c0" stroke="#404040" stroke-width="1"/>
  <rect x="2" y="6" width="27" height="1" fill="#ffffff"/>
  <rect x="2" y="6" width="1" height="21" fill="#ffffff"/>
  <!-- Screen -->
  <rect x="5" y="9" width="22" height="16" fill="#12100c" stroke="#2a2a2a" stroke-width="0.5"/>
  <!-- The ladder: five rungs, the middle one lit -->
  <rect x="7" y="11" width="3" height="2" fill="#1f3a1f"/>
  <rect x="7" y="14" width="3" height="2" fill="#1f3a1f"/>
  <rect x="7" y="17" width="3" height="2" fill="#f2c744"/>
  <rect x="7" y="20" width="3" height="2" fill="#3a2410"/>
  <rect x="7" y="23" width="3" height="1" fill="#3a1414"/>
  <!-- The number -->
  <path d="M14 12 H22 L18 16 H21 V21 H14 V19 H19 V18 H16 V16 L20 13 H14 Z" fill="#f2c744"/>
  <!-- Warning lamp -->
  <rect x="14" y="2" width="4" height="3" fill="#e5484d" stroke="#7a1418" stroke-width="0.6"/>
  <rect x="15" y="5" width="2" height="1" fill="#404040"/>
</svg>
