<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- A popup ad, mid-break: the 95 window frame with a crack through it
       and a piece already coming away. -->
  <rect x="2" y="5" width="28" height="22" fill="#c0c0c0" stroke="#404040" stroke-width="1"/>
  <rect x="2" y="5" width="27" height="1" fill="#ffffff"/>
  <rect x="2" y="5" width="1" height="21" fill="#ffffff"/>
  <!-- Title bar -->
  <rect x="4" y="7" width="24" height="4" fill="#000080"/>
  <rect x="24" y="7" width="4" height="4" fill="#c0c0c0" stroke="#404040" stroke-width="0.5"/>
  <!-- Ad content -->
  <rect x="4" y="12" width="24" height="13" fill="#0b1020"/>
  <!-- Corg going through it -->
  <circle cx="13" cy="18" r="4" fill="#e08a2e" stroke="#7a3f0a" stroke-width="1"/>
  <rect x="11" y="16" width="1" height="1" fill="#3a1d05"/>
  <rect x="14" y="16" width="1" height="1" fill="#3a1d05"/>
  <rect x="12" y="19" width="2" height="1" fill="#fff"/>
  <!-- Cracks -->
  <path d="M17 18 L22 13 M17 18 L23 19 M17 18 L21 24" stroke="#8fd0ff" stroke-width="1.2" fill="none"/>
  <!-- A shard leaving the frame -->
  <path d="M27 4 L31 7 L26 9 Z" fill="#dfe8f5" stroke="#5a6b80" stroke-width="0.6"/>
</svg>
