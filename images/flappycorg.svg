<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Sky -->
  <rect x="1" y="4" width="30" height="24" rx="2" fill="#4ec0ca" stroke="#0a1230" stroke-width="1"/>
  <!-- Ground -->
  <rect x="2" y="24" width="28" height="3" fill="#ded895"/>
  <rect x="2" y="24" width="28" height="1" fill="#7ec850"/>
  <!-- CORG can pipes: top and bottom of one gap -->
  <rect x="21" y="5" width="7" height="8" fill="#8b1f1f" stroke="#3a0a0a" stroke-width="1"/>
  <rect x="20" y="11" width="9" height="3" fill="#b52b2b" stroke="#3a0a0a" stroke-width="1"/>
  <rect x="21" y="20" width="7" height="4" fill="#8b1f1f" stroke="#3a0a0a" stroke-width="1"/>
  <rect x="20" y="18" width="9" height="3" fill="#b52b2b" stroke="#3a0a0a" stroke-width="1"/>
  <!-- Corg, mid-flap -->
  <circle cx="10" cy="15" r="4.5" fill="#e08a2e" stroke="#7a3f0a" stroke-width="1"/>
  <rect x="8" y="13" width="1" height="1" fill="#3a1d05"/>
  <rect x="11" y="13" width="1" height="1" fill="#3a1d05"/>
  <rect x="9" y="16" width="2" height="1" fill="#fff"/>
  <!-- Wing -->
  <path d="M5 15 L9 12 L9 17 Z" fill="#f6c07a" stroke="#7a3f0a" stroke-width="0.7"/>
</svg>
